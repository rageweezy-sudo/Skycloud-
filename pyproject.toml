[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "account-privacy"
version = "0.1.0"
description = "Local account discovery and personal data requests"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "idna>=3.7,<4",
    "PySide6>=6.8,<7; sys_platform == 'win32'",
    "sqlcipher3>=0.6,<0.7; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["PyInstaller>=6.11,<7"]

[tool.setuptools.package-data]
account_privacy = ["core/migrations/*.sql", "resources/*.dat", "resources/*.json", "resources/templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
